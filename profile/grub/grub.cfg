# XrOS — меню загрузки live-ISO (GRUB).
# Тема: profile/grub/theme/theme.txt, фон grub-bg.jpg.
# Пункты — только понятные, без лишнего.

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod exfat
insmod udf

# Шрифты темы (DejaVu, .pf2 лежат в profile/grub/theme/ и попадают
# на ISO в /boot/grub/theme/). mkarchiso сам шрифты на ISO не кладёт,
# а ${prefix} в live-GRUB — это memdisk образа GRUB, а не ISO,
# поэтому все пути — от корня ISO (/boot/grub/...), а не от ${prefix}:
# с ${prefix} loadfont/theme молча не находились бы и меню было бы
# текстовым. Без шрифтов тема не грузится целиком.
for _font in DejaVuSans-12 DejaVuSans-14 DejaVuSans-Bold-16; do
    loadfont "/boot/grub/theme/${_font}.pf2"
done
unset _font

terminal_input console
# Тема грузится БЕЗУСЛОВНО (без [ -f ... ]): в UEFI-образе mkarchiso 92
# нет модуля test, поэтому любая проверка [ ... ] там ложна — с ней
# тема/фон не загружались и меню было текстовым
# (эксперимент: experiments/uefi-test-module/, QEMU 10.11.2026).
# Если файла темы нет, GRUB печатает ошибку и продолжает без темы —
# меню всё равно работает (gfxterm с цветами по умолчанию).
insmod all_video
set gfxmode="auto"
terminal_output gfxterm
set theme=/boot/grub/theme/theme.txt

insmod serial
insmod usbserial_common
insmod usbserial_ftdi
insmod usbserial_pl2303
insmod usbserial_usbdebug
if serial --unit=0 --speed=115200; then
    terminal_input --append serial
    terminal_output --append serial
fi

# Платформа — через regexp, а не [ ... ] == ...: модуль test отсутствует
# в UEFI-образе mkarchiso, а regexp есть и в UEFI-, и в BIOS-списке
# модулей. Если regexp вдруг недоступен, условие ложно и берётся
# ветка else ("x86_64-efi"/"i386-pc") — меню всё равно работает.
if regexp '^efi$' "${grub_platform}"; then
    archiso_platform='UEFI'
elif regexp '^pc$' "${grub_platform}"; then
    archiso_platform='BIOS'
else
    archiso_platform="${grub_cpu}-${grub_platform}"
fi

# Тема XrOS: фон, шрифты, выделение — из theme.txt.
# Если тема не загрузилась, падаем на простые цвета, а не на ошибку.
# Фон — тоже безусловно, по той же причине (нет модуля test на UEFI).
insmod jpeg
background_image /boot/grub/grub-bg.jpg
set menu_color_normal=white/black
set menu_color_highlight=white/magenta
set color_normal=white/black
set color_highlight=white/magenta

default=xros
timeout=10
timeout_style=menu

menuentry "XrOS 1.0 (%ARCH%, ${archiso_platform})" --class xros --class gnu-linux --class gnu --class os --id 'xros' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "XrOS 1.0 — с диктором" --hotkey s --class xros --class gnu-linux --class gnu --class os --id 'xros-accessibility' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

# Memtest86+ и UEFI Shell намеренно отсутствуют: пакеты memtest86+-efi
# и edk2-shell не входят в profile/packages.x86_64, поэтому mkarchiso
# не кладёт их файлы на ISO и пункты меню никогда не появлялись бы
# (см. docs/final-refinement/bootloader.md). Чтобы вернуть пункты —
# добавить пакеты в packages.x86_64 и вернуть menuentry. Проверки -f
# для условного показа НЕ использовать: модуля test нет в UEFI-образе
# mkarchiso (см. experiments/uefi-test-module/), [ -f ... ] там всегда
# ложна. Для проверки наличия файла — search --file --set=_dev <путь>
# (модуль search есть в образе, root при --set не меняется).
if regexp '^efi$' "${grub_platform}"; then
    menuentry 'Настройки UEFI' --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'Выключить компьютер' --class shutdown --class poweroff {
    echo 'Выключение...'
    halt
}

menuentry 'Перезагрузить компьютер' --class reboot --class restart {
    echo 'Перезагрузка...'
    reboot
}
