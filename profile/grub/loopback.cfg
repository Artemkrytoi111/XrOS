# XrOS — loopback-загрузка ISO из GRUB (загрузка ISO-файла с диска).
# По образцу archiso releng (configs/grub/loopback.cfg):
# внешний GRUB на диске сначала делает:
#   set iso_path="/xros.iso"
#   export iso_path
#   search --set=root --file $iso_path
#   loopback loop $iso_path
#   root=(loop)
#   configfile /boot/grub/loopback.cfg
# Этот файл НЕ делает loopback сам — он уже запущен с loop-устройства
# (root=(loop)). Пункты меню передают ядру img_dev/img_loop, чтобы
# archiso смонтировал раздел с ISO-файлом и loop-смонтировал сам ISO:
# без этих параметров ядро не находит образ и загрузка падает.
# (Старая версия файла грузила /boot/grub/grub.cfg без img_dev/img_loop —
# это не работало.)
#
# Шрифты/тема — как в grub.cfg: пути от корня ISO, ${prefix} здесь —
# memdisk образа GRUB, а не ISO.

set iso_path="/xros.iso"
export iso_path

# Найти раздел с ISO-файлом и его UUID
search --no-floppy --set=archiso_img_dev --file "${iso_path}"
probe --set archiso_img_dev_uuid --fs-uuid "${archiso_img_dev}"

# Шрифты темы DejaVu (.pf2 в /boot/grub/theme/ на ISO)
for _font in DejaVuSans-12 DejaVuSans-14 DejaVuSans-Bold-16; do
    loadfont "/boot/grub/theme/${_font}.pf2"
done
unset _font

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod exfat
insmod udf

terminal_input console
# Тема и фон грузятся БЕЗУСЛОВНО (без [ -f ... ]): в UEFI-образе mkarchiso 92
# нет модуля test, поэтому любая проверка [ ... ] там ложна
# (эксперимент: experiments/uefi-test-module/, QEMU 10.11.2026).
# Если файла нет, GRUB печатает ошибку и продолжает без темы.
insmod all_video
set gfxmode="auto"
terminal_output gfxterm
set theme=/boot/grub/theme/theme.txt
insmod jpeg
background_image /boot/grub/grub-bg.jpg
set menu_color_normal=white/black
set menu_color_highlight=white/magenta
set color_normal=white/black
set color_highlight=white/magenta

# Платформа — через regexp, а не [ ... ] == ... (модуля test нет
# в UEFI-образе mkarchiso; regexp есть и в UEFI-, и в BIOS-списке).
if regexp '^efi$' "${grub_platform}"; then
    archiso_platform='UEFI'
elif regexp '^pc$' "${grub_platform}"; then
    archiso_platform='BIOS'
else
    archiso_platform="${grub_cpu}-${grub_platform}"
fi

default=xros
timeout=10
timeout_style=menu

menuentry "XrOS 1.0 (%ARCH%, ${archiso_platform})" --class xros --class gnu-linux --class gnu --class os --id 'xros' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "XrOS 1.0 — с диктором" --hotkey s --class xros --class gnu-linux --class gnu --class os --id 'xros-accessibility' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" accessibility=on %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

# Memtest86+ и UEFI Shell намеренно отсутствуют: пакеты memtest86+-efi
# и edk2-shell не входят в profile/packages.x86_64, поэтому mkarchiso
# не кладёт их файлы на ISO и пункты меню никогда не появлялись бы
# (см. docs/final-refinement/bootloader.md). Чтобы вернуть пункты —
# добавить пакеты в packages.x86_64 и вернуть menuentry. Проверки -f
# для условного показа НЕ использовать: модуля test нет в UEFI-образе
# mkarchiso (см. experiments/uefi-test-module/). Для проверки наличия
# файла — search --file --set=_dev <путь> (root при --set не меняется).
if regexp '^efi$' "${grub_platform}"; then
    menuentry 'Настройки UEFI' --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'Выключить компьютер' --class shutdown --class poweroff {
    echo 'Выключение...'
    halt
}

menuentry 'Перезагрузить компьютер' --class reboot --class restart {
    echo 'Перезагрузка...'
    reboot
}
