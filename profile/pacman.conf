#
# /etc/pacman.conf — XrOS (на базе стандартного pacman.conf Arch Linux)
# Плюс репозиторий [xros] с пакетами проекта.
#
# Основной сервер — GitHub Pages репозитория обновлений безопасности:
# https://github.com/Artemkrytoi111/XrOS-Security-Updates
# Запасной источник — снимок репозитория внутри ISO/системы
# (file:///usr/share/xros/repo/).
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
#CheckSpace
#VerbosePkgLists
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
#RemoteFileSigLevel = Required

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# XrOS: собственный репозиторий пакетов проекта (обновления безопасности).
# Основной сервер — GitHub Pages (репозиторий XrOS-Security-Updates).
# Запасной источник — снимок репозитория внутри ISO/системы.
# D10 (12.11.2026): обязательная проверка подписи включена (разрешение владельца).
# Публичный ключ импортируется в customize_airootfs.sh.
# Автообновления: механизм есть (xros-auto-update.timer/service +
# /usr/local/bin/xros-auto-update), но таймер нигде не включён.
# В живой системе скрипт ничего не делает (защита по маркерам
# archiso); в установленной системе таймер включает установщик —
# отдельным шагом, после GPG-подписи [xros] (см. A-04).
[xros]
# A-04 (15.11.2026): пакеты [xros] подписаны production-ключом
# B16629E8B17270764AED33013D1718A6EE45C94C (см. xros-gpg-prod/,
# docs/REPO-PUBLISHING.md §2.3). SigLevel = Required: неподписанные
# пакеты и БД не принимаются. TrustAll НЕ использовать: оно отключает
# проверку даже подписанных пакетов.
SigLevel = Required
Server = https://artemkrytoi111.github.io/XrOS-Security-Updates/xros/os/$arch
Server = file:///usr/share/xros/repo/$repo/os/$arch
