# XrOS — конфигурация production GPG-подписи (ТОЛЬКО публичные данные).
#
# XROS_GPG_PROD_FPR — отпечаток production-ключа подписи XrOS (40 hex).
#   Пусто = production-ключ владельцем ещё не предоставлен. Это НЕ ошибка,
#   а состояние «GPG не настроен»: dev-сборка продолжается с явным
#   предупреждением (SigLevel=Optional), а релизная сборка (--release)
#   блокируется гейтом (см. scripts/build.sh).
#   Тестовый ключ 0EC935D2… сюда НЕ пишется: он только для xros-gpg-test/.
# XROS_GPG_PROD_KEY — путь к публичному ключу production (armored, только
#   публичный ключ) относительно корня репозитория. Файл появляется,
#   когда владелец создаст ключ офлайн и положит его в xros-gpg-prod/.
#   Приватный ключ сюда НЕ кладётся никогда (см. xros-gpg-prod/README.md).
XROS_GPG_PROD_FPR="52F963537CCD76C941B4DFD7B0DD24EE45116C8A"
XROS_GPG_PROD_KEY="xros-gpg-prod/xros-public.key"
