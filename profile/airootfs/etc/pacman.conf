#
# /etc/pacman.conf — XrOS (на базе стандартного pacman.conf Arch Linux)
# Плюс репозиторий [xros] с пакетами проекта.
#
# Основной сервер — GitHub Pages репозитория обновлений безопасности:
# https://github.com/Artemkrytoi111/XrOS-Security-Updates
# Запасной источник — снимок репозитория внутри ISO/системы
# (file:///usr/share/xros/repo/).
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
#CheckSpace
#VerbosePkgLists
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
#RemoteFileSigLevel = Required

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# XrOS: собственный репозиторий пакетов проекта (обновления безопасности).
# Основной сервер — GitHub Pages (репозиторий XrOS-Security-Updates).
# Запасной источник — снимок репозитория внутри ISO/системы.
# Подпись GPG — следующий шаг; пока TrustAll.
# Автообновления из [xros] ВКЛЮЧАТЬ НЕЛЬЗЯ, пока репозиторий
# не подписан (SigLevel станет Required, появится ключ GPG):
# таймер xros-update.timer нигде не включён — см. repo/README.md.
[xros]
SigLevel = Optional TrustAll
Server = https://artemkrytoi111.github.io/XrOS-Security-Updates/xros/os/$arch
Server = file:///usr/share/xros/repo/$repo/os/$arch
