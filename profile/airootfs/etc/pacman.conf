# Generated by scripts/xros-build-env.sh. And start with [options] section.
#
# NOTE: Do not edit [options] section manually. It is automatically included
# from /usr/share/archiso/configs/releng/pacman.conf by mkarchiso.
#
# If you need to modify the global pacman settings, create a pacman.conf.d
# directory next to this file and place your custom config there.

[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
CheckSpace
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
#RemoteFileSigLevel = Required

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# --- XrOS ------------------------------------------------------------------
# Пакеты проекта [xros]. Основной сервер — GitHub Pages
# (XrOS-Security-Updates); запасной — снимок в /usr/share/xros/repo
# (его наполняет build.sh; в живую систему кладёт снимок на момент
# сборки — автообновление из него не работает: см. xros-auto-update).
# В развитии релиза второй сервер — закомментирован, чтобы локальный
# file:// не перекрывал подписанный репозиторий (см. A-04).
[xros]
# A-04 (15.11.2026): пакеты [xros] подписаны production-ключом
# B16629E8B17270764AED33013D1718A6EE45C94C (см. xros-gpg-prod/,
# docs/REPO-PUBLISHING.md §2.3). SigLevel = Required: неподписанные
# пакеты и БД не принимаются. TrustAll НЕ использовать: оно отключает
# проверку даже подписанных пакетов.
SigLevel = Required
Server = https://artemkrytoi111.github.io/XrOS-Security-Updates/xros/os/$arch
Server = file:///usr/share/xros/repo/$repo/os/$arch
