#
# /etc/pacman.conf — XrOS (на базе стандартного pacman.conf Arch Linux)
# Плюс репозиторий [xros] с пакетами проекта.
#
# PLACEHOLDER: домен xros.example НЕ СУЩЕСТВУЕТ — действующего сервера
# репозитория нет. URL ниже — заглушка до публикации (этап 9).
# Пока работает ТОЛЬКО запасной источник — снимок репозитория внутри
# ISO/системы (file:///usr/share/xros/repo/). Если снимка в системе
# нет, pacman -Sy по [xros] завершится ошибкой — это ожидаемо,
# обновления из [xros] до публикации недоступны.
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
#CheckSpace
#VerbosePkgLists
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
#RemoteFileSigLevel = Required

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# XrOS: собственный репозиторий пакетов проекта.
# PLACEHOLDER: основной сервер https://xros.example/repo/$repo/os/$arch
# не существует (домен xros.example — заглушка, публикации нет).
# Запасной источник — снимок репозитория внутри ISO/системы.
# Подпись GPG — следующий шаг после публикации; пока TrustAll.
# Автообновления из [xros] ВКЛЮЧАТЬ НЕЛЬЗЯ, пока репозиторий
# не подписан (SigLevel станет Required, появится ключ GPG):
# таймер xros-update.timer нигде не включён — см. repo/README.md.
[xros]
SigLevel = Optional TrustAll
Server = https://xros.example/repo/$repo/os/$arch
Server = file:///usr/share/xros/repo/$repo/os/$arch
