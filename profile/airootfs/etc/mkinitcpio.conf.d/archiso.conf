# XrOS — mkinitcpio для живой системы (archiso).
# Сверено 10.11.2026 с пакетом mkinitcpio-archiso 73-1 (archiso 92-1):
# пакет НЕ поставляет свой archiso.conf — этот файл берётся из профиля
# (как в releng); все хуки archiso* из списка есть в пакете
# (/usr/lib/initcpio/install/: archiso, archiso_loop_mnt,
# archiso_pxe_common, archiso_pxe_http, archiso_pxe_nbd,
# archiso_pxe_nfs, archiso_kms), остальные — стандартные хуки mkinitcpio.
MODULES=()
BINARIES=()
FILES=()
HOOKS=(base udev archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs archiso_kms block filesystems keyboard)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19)
