[Unit]
# XrOS Diamond (12.11.2026, D8):
# plasma-ksplash.service TimeoutSec=40s истекает под медленным TCG/QEMU.
# Увеличиваем до 120s. Splash не отключается.
# A-17: TimeoutSec в [Unit] недействителен (systemd его там игнорирует);
# время запуска задаётся только TimeoutStartSec в [Service].

[Service]
TimeoutStartSec=120s
