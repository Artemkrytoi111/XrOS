[Unit]
# XrOS fixed6 (11.11.2026): plasmashell прерывал загрузку оболочки
# ("Aborting shell load: The activity manager daemon (kactivitymanagerd)
# is not running"), потому что kactivitymanagerd стартовал только через
# D-Bus-активацию — на 27 с позже plasmashell под медленным TCG
# (подтверждено журналом установленной системы, 2 загрузки подряд).
# Plasmashell при этом не выходит, а остаётся висеть без оболочки
# (Restart=on-failure не срабатывает) — рабочий стол не появляется.
# Явный запуск kactivitymanagerd до plasmashell устраняет гонку.
Wants=plasma-kactivitymanagerd.service
After=plasma-kactivitymanagerd.service
