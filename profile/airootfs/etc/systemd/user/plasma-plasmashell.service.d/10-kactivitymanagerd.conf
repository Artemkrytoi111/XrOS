[Unit]
# XrOS fixed6 (11.11.2026): plasmashell прерывал загрузку оболочки
# ("Aborting shell load: The activity manager daemon (kactivitymanagerd)
# is not running"), потому что kactivitymanagerd стартовал только через
# D-Bus-активацию — на 27 с позже plasmashell под медленным TCG
# (подтверждено журналом установленной системы, 2 загрузки подряд).
# Plasmashell при этом не выходит, а остаётся висеть без оболочки
# (Restart=on-failure не срабатывает) — рабочий стол не появляется.
# Явный запуск kactivitymanagerd до plasmashell устраняет гонку.
# fixed7 (11.11.2026): repro fixed6 Live (FIXED6-REPRO-RESULT.md)
# показал, что drop-in НЕ ломает Live-стол: юнит active/running
# С drop-in, стол полностью работает (обои + панель + приветствие).
# Чёрный стол ночного агента — разовый тайминг-флейк под TCG.
# Но After= для Type=simple гарантирует только порядок fork'а,
# а не готовность bus-name — поэтому fixed7 добавляет ниже
# ExecStartPre с явным ожиданием org.kde.ActivityManager на шине.
Wants=plasma-kactivitymanagerd.service
After=plasma-kactivitymanagerd.service

[Service]
# Ждать готовности ActivityManager (до ~60 с под TCG), всегда exit 0:
# при любом сбое plasmashell стартует как раньше, без блокировки.
ExecStartPre=/usr/local/bin/xros-wait-kactivitymanagerd
# Базовый юнит: TimeoutSec=40sec. Ожидание в ExecStartPre может занять
# до ~60 с под TCG — поднимаем стартовый таймаут, чтобы systemd не
# убил plasmashell на старте.
TimeoutStartSec=120s
