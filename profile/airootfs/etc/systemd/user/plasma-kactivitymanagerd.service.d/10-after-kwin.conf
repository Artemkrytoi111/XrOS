[Unit]
# XrOS fixed10 (11.11.2026, D1): kactivitymanagerd падал при первом
# запуске сессии («no Qt platform plugin could be initialized», core dump)
# — у юнита нет After=, и он стартовал до появления Wayland-сокета
# (QT_QPA_PLATFORM=wayland без WAYLAND_DISPLAY). Второй экземпляр
# стартовал уже после появления дисплея и работал.
# Ждать kwin_wayland: демон стартует после композитора, а plasmashell
# по-прежнему ждёт его bus-name через ExecStartPre (xros-wait-
# kactivitymanagerd в 10-kactivitymanagerd.conf). Второго механизма
# запуска НЕ создаётся: это тот же юнит, только порядок.
After=plasma-kwin_wayland.service
