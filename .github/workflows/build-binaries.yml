name: build-binaries

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install git before checkout
        run: pacman -Sy --noconfirm git

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: pacman -Sy --noconfirm base-devel rust git python

      - name: Configure git and renormalize
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --renormalize .

      - name: Stage xros-installer-diamond (required by prepare())
        run: |
          cp -a src/xros-installer-diamond packages/xros-installer/xros-installer-diamond
          rm -rf packages/xros-installer/xros-installer-diamond/__pycache__

      - name: Build CLI and GUI
        run: |
          cargo build --release --manifest-path src/xros-cli/Cargo.toml
          cargo build --release --manifest-path src/xros-install-gui-rs/Cargo.toml

      - name: Install rebuilt binaries
        run: |
          cp src/xros-cli/target/release/xros packages/xros-cli/xros
          cp src/xros-install-gui-rs/target/release/xros-install-gui packages/xros-installer/xros-install-gui
          cp packages/xros-cli/xros profile/airootfs/usr/local/bin/xros
          cp packages/xros-installer/xros-install-gui profile/airootfs/usr/local/bin/xros-install-gui

      - name: Update recorded hashes
        run: |
          NEW_CLI_SHA=$(sha256sum packages/xros-cli/xros | cut -d' ' -f1)
          echo "new CLI sha256: $NEW_CLI_SHA"
          NEW_CLI_SHA="$NEW_CLI_SHA" python3 - <<'PYEOF'
          import os, re
          p = 'packages/xros-cli/PKGBUILD'
          s = open(p).read()
          new_sha = os.environ['NEW_CLI_SHA']
          s2, n = re.subn(r"(sha256sums=\(')[0-9a-f]{64}", r"\g<1>" + new_sha, s, count=1)
          assert n == 1, "sha256sums[0] not found in PKGBUILD"
          open(p, 'w').write(s2)
          print("PKGBUILD sha256sums[0] updated to", new_sha)
          PYEOF
          (cd src/xros-install-gui-rs && sha256sum Cargo.toml Cargo.lock src/*.rs | sort -k2 | sha256sum | cut -d' ' -f1) > packages/xros-installer/xros-install-gui.sha256
          cat packages/xros-installer/xros-install-gui.sha256

      - name: Repack packages as nobody (makepkg refuses root)
        run: |
          chown -R nobody:nobody packages/xros-cli packages/xros-installer
          runuser -u nobody -- env HOME=/tmp bash -c "cd packages/xros-cli && makepkg -fc --noconfirm"
          runuser -u nobody -- env HOME=/tmp bash -c "cd packages/xros-installer && makepkg -fc --noconfirm"
          ls -la packages/xros-cli/*.pkg.tar.zst packages/xros-installer/*.pkg.tar.zst

      - name: Verify sync and diagnose
        run: |
          cmp packages/xros-cli/xros profile/airootfs/usr/local/bin/xros
          cmp packages/xros-installer/xros-install-gui profile/airootfs/usr/local/bin/xros-install-gui
          ./scripts/xros-diagnose.sh > /tmp/diag.log 2>&1 || true
          grep -E "xros-install-gui|A-05|sha256|Итого" /tmp/diag.log | head -30

      - name: Commit and push if changed
        run: |
          git status --porcelain
          git add -f packages/xros-cli/xros packages/xros-cli/PKGBUILD packages/xros-cli/*.pkg.tar.zst
          git add -f packages/xros-installer/xros-install-gui packages/xros-installer/xros-install-gui.sha256 packages/xros-installer/*.pkg.tar.zst
          git add -f packages/xros-installer/xros-installer-diamond
          git add -f profile/airootfs/usr/local/bin/xros profile/airootfs/usr/local/bin/xros-install-gui
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: rebuild GUI/CLI binaries from current sources"
            git push
          fi
