name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shell:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck
        run: pacman -Sy --noconfirm shellcheck
      - name: shellcheck
        run: |
          shellcheck -S warning scripts/*.sh src/xros-install
          if grep -RIniE 'password.*xros' src/ profile/ scripts/ --exclude-dir=__pycache__; then
            echo "default password found" >&2
            exit 1
          fi

  rust:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        run: pacman -Sy --noconfirm base-devel rust
      - name: cargo check (xros-cli)
        run: cargo check --manifest-path src/xros-cli/Cargo.toml
      - name: cargo check (Rust GUI)
        run: cargo check --manifest-path src/xros-install-gui-rs/Cargo.toml

  python-bridge:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Python + pytest
        run: pacman -Sy --noconfirm python python-pytest
      - name: bridge security tests
        working-directory: src/xros-installer-diamond
        run: python3 -m pytest test_bridge_security.py -v

  diagnose:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v5
      - name: Normalize profile permissions (checkout umask 0002)
        run: |
          chmod -R g-w profile/airootfs
          chmod 750 profile/airootfs/root
      - name: Install diagnose deps
        run: pacman -Sy --noconfirm base-devel python shellcheck rust grub python-pillow
      - name: Fetch Rust dependencies (diagnose runs cargo --offline)
        run: |
          cargo fetch --manifest-path src/xros-cli/Cargo.toml
          cargo fetch --manifest-path src/xros-install-gui-rs/Cargo.toml
      - name: xros-diagnose
        run: ./scripts/xros-diagnose.sh
